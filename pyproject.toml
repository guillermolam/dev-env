[dependency-groups]
quality = [
  "radon==6.0.1",
  "cognitive-complexity==1.3.0",
  "ruff==0.17.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["operations/.cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 3
